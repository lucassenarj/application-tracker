map $host $safe_host {
    default local.application-tracker.lucassenarj.dev;
    local.application-tracker.lucassenarj.dev local.application-tracker.lucassenarj.dev;
    local.api.application-tracker.lucassenarj.dev local.api.application-tracker.lucassenarj.dev;
}

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name local.application-tracker.lucassenarj.dev local.api.application-tracker.lucassenarj.dev;
    return 301 https://$safe_host$request_uri;
}

server {
    listen 443 ssl;
    server_name local.application-tracker.lucassenarj.dev;

    ssl_certificate     /etc/nginx/certs/local.pem;
    ssl_certificate_key /etc/nginx/certs/local-key.pem;

    location / {
        proxy_pass http://frontend:5173;
        proxy_set_header Host local.application-tracker.lucassenarj.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name local.api.application-tracker.lucassenarj.dev;

    ssl_certificate     /etc/nginx/certs/local.pem;
    ssl_certificate_key /etc/nginx/certs/local-key.pem;

    limit_req zone=api_limit burst=20 nodelay;

    location / {
        proxy_pass http://api:3000;
        proxy_set_header Host local.api.application-tracker.lucassenarj.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
