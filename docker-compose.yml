services:
  api:
    build: ./api
    container_name: application-tracker-api
    working_dir: /app
    restart: unless-stopped
    depends_on:
      - db

    environment:
      DATABASE_URL: postgresql://application_tracker:application_tracker@db:5432/application_tracker?schema=public

    ports:
      - "3000:3000"

    volumes:
      - ./api:/app
      - /app/node_modules

  db:
    image: postgres:18-alpine
    container_name: application-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: application_tracker
      POSTGRES_PASSWORD: application_tracker
      POSTGRES_DB: application_tracker
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql

  frontend:
    build: ./frontend
    container_name: application-tracker-frontend
    restart: unless-stopped

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

  nginx:
    image: nginx:stable-alpine
    container_name: application-tracker-nginx
    restart: unless-stopped
    depends_on:
      - api
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro

volumes:
  db-data:
