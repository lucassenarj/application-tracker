name: api-ci

on:
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/api-ci.yml'
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/api-ci.yml'

defaults:
  run:
    working-directory: api

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'yarn'
          cache-dependency-path: api/yarn.lock
      - run: yarn install --immutable
      - run: node_modules/.bin/prisma generate
      - run: yarn eslint "{src,apps,libs,test}/**/*.ts"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'yarn'
          cache-dependency-path: api/yarn.lock
      - run: yarn install --immutable
      - run: node_modules/.bin/prisma generate
      - run: npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    env:
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'yarn'
          cache-dependency-path: api/yarn.lock
      - run: yarn install --immutable
      - run: node_modules/.bin/prisma generate
      - run: yarn test:cov

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: application_tracker
          POSTGRES_PASSWORD: application_tracker
          POSTGRES_DB: application_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://application_tracker:application_tracker@localhost:5432/application_tracker?schema=public
      JWT_SECRET: ci-test-jwt-secret
      CSRF_SECRET: ci-test-csrf-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'yarn'
          cache-dependency-path: api/yarn.lock
      - run: yarn install --immutable
      - run: node_modules/.bin/prisma generate
      - run: node_modules/.bin/prisma migrate deploy
      - run: yarn test:integration

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: application_tracker
          POSTGRES_PASSWORD: application_tracker
          POSTGRES_DB: application_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://application_tracker:application_tracker@localhost:5432/application_tracker?schema=public
      JWT_SECRET: ci-test-jwt-secret
      CSRF_SECRET: ci-test-csrf-secret
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'yarn'
          cache-dependency-path: api/yarn.lock
      - run: yarn install --immutable
      - run: node_modules/.bin/prisma generate
      - run: node_modules/.bin/prisma migrate deploy
      - run: yarn test:e2e

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: api
          file: api/Dockerfile.prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
