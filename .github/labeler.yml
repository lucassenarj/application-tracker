api:
  - changed-files:
      - any-glob-to-any-file: 'api/**'

frontend:
  - changed-files:
      - any-glob-to-any-file: 'frontend/**'

chrome-extension:
  - changed-files:
      - any-glob-to-any-file: 'chrome-extension/**'

ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'
          - 'Dockerfile'
          - 'docker-compose.yml'

infra:
  - changed-files:
      - any-glob-to-any-file: 'nginx/**'

docs:
  - changed-files:
      - any-glob-to-any-file:
          - 'README.md'
          - 'DECISIONS.md'
          - 'C4-MODEL.md'
          - 'CLAUDE.md'
